<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1118" />
    <meta
      name="description"
      content="The requested page was not found. Return to Amin Hanif's game and app developer portfolio."
    />
    <link rel="icon" type="image/svg+xml" href="/ah-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/404.css" />
    <title>Lost Level | Amin Hanif Portfolio</title>
    <script defer src="/404.js"></script>
      <script
      defer
      src="/site-analytics.js"
      data-site-analytics="true"
      data-measurement-id="G-TMGSL66PFH"
      data-site-area="not_found"
      data-content-name="404"
    ></script>
  </head>
  <body>
    <header class="error-header">
      <a class="brand-link" href="/" aria-label="Amin Hanif portfolio home">Amin Hanif</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use light theme">
        <span class="theme-symbol" aria-hidden="true"></span>
        <span data-theme-label>Light</span>
      </button>
    </header>

    <main class="error-main">
      <section class="error-copy" data-analytics-section="not_found_message">
        <p class="eyebrow">System / 404</p>
        <h1>Lost Level</h1>
        <p class="error-lead">
          This route is not part of the current build. Continue from a known checkpoint.
        </p>
        <p class="route-path" aria-label="Page that was not found">
          <span>Missing route</span>
          <strong data-missing-path>/unknown</strong>
        </p>
        <nav class="recovery-actions" aria-label="404 recovery links">
          <a class="recovery-link is-primary" href="/" data-analytics-action="404_home">Back home</a>
          <a class="recovery-link" href="/#projects" data-analytics-action="404_projects">Browse projects</a>
          <a class="recovery-link" href="/#contact" data-analytics-action="404_contact">Contact</a>
        </nav>
      </section>

      <section class="lost-world" aria-label="Lost game world" data-lost-world>
        <div class="world-grid" aria-hidden="true"></div>
        <div class="world-route route-one" aria-hidden="true"></div>
        <div class="world-route route-two" aria-hidden="true"></div>

        <figure class="game-node node-one" aria-hidden="true">
          <img src="/images/projects/adventure-of-hanacaraka.webp" alt="" />
        </figure>
        <figure class="game-node node-two" aria-hidden="true">
          <img src="/images/projects/mysticalipse-dungeon.webp" alt="" />
        </figure>
        <figure class="game-node node-three" aria-hidden="true">
          <img src="/images/projects/isolated-forest.webp" alt="" />
        </figure>
        <figure class="game-node node-four" aria-hidden="true">
          <img src="/images/projects/sleep-gravity.webp" alt="" />
        </figure>

        <div class="lost-marker">
          <strong>404</strong>
          <span>Checkpoint missing</span>
        </div>
      </section>
    </main>

    <footer class="error-footer">
      <span>&copy; 2026 Amin Hanif. All rights reserved.</span>
      <nav aria-label="Footer navigation">
        <a href="/terms/">Site terms</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </footer>
  </body>
</html>
